services:
  db:
    image: postgres:16-alpine
    container_name: ohnyk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ohnyk
      POSTGRES_PASSWORD: ohnyk
      POSTGRES_DB: ohnyk
    ports:
      - '5432:5432'
    volumes:
      - ohnyk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ohnyk -d ohnyk']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: ohnyk-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '8080:8080'

volumes:
  ohnyk-db-data:
