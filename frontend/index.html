<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ohnyk — Домашня кухня твого району</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Josefin+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 108'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='50%25' y1='0%25' x2='50%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23F8BC63'/%3E%3Cstop offset='52%25' stop-color='%23F0913F'/%3E%3Cstop offset='100%25' stop-color='%23DD5F27'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='url(%23g)'%3E%3Cpath d='M30 46 Q41 63 30 84 Q19 63 30 46 Z' transform='rotate(-9 30 65)'/%3E%3Cpath d='M70 46 Q81 63 70 84 Q59 63 70 46 Z' transform='rotate(9 70 65)'/%3E%3Cpath d='M50 6 Q69 45 50 84 Q31 45 50 6 Z'/%3E%3C/g%3E%3Cpath d='M25 90 Q50 101 75 90' fill='none' stroke='url(%23g)' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the saved theme before paint to avoid a flash (default: dark). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ohnyk_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
