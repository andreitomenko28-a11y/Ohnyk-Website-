<!doctype html>
<!--
  Ohnyk — відтворення логотипа (HTML/CSS + inline SVG).
  Шрифт напису: Forum (Google Fonts). Полум'я/дуга — векторний SVG.
  Блок .stage масштабується без втрати якості (одиниці cqw прив'язані до ширини).
-->
<html lang="uk">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;background:#130a06}
  .stage{
    position:relative; width:min(620px,100vw); aspect-ratio:1/1; margin:0 auto;
    container-type:inline-size;
    background:radial-gradient(60% 55% at 52% 42%, #3a2410 0%, #241408 38%, #180d07 72%, #130a06 100%);
    overflow:hidden; font-family:'Forum', serif;
  }
  .glow{
    position:absolute; left:50%; top:38%; width:52%; height:46%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 50%, rgba(244,150,48,.30), rgba(244,150,48,.10) 42%, transparent 66%);
    filter:blur(1cqw);
  }
  .flame{ position:absolute; left:50%; top:23%; width:35%; transform:translateX(-50%); }
  .word{
    position:absolute; left:0; right:0; top:57.2%; text-align:center;
    color:#f5ead6; font-size:18.39cqw; line-height:1; letter-spacing:.075em;
    text-shadow:0 .16cqw 2.9cqw rgba(0,0,0,.35);
  }
  .slogan{
    position:absolute; left:0; right:0; top:78.3%; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:2.58cqw;
    color:#e0a03c; font-size:2.74cqw; letter-spacing:.28em; text-transform:uppercase;
  }
  .slogan .dash{ display:inline-block; width:4.19cqw; height:1px; background:linear-gradient(90deg,transparent,#c9862f); }
  .slogan .dash.r{ background:linear-gradient(90deg,#c9862f,transparent); }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <svg class="flame" viewBox="0 0 350 340" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fg" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#FAC24E"/>
          <stop offset="45%" stop-color="#F0902A"/>
          <stop offset="100%" stop-color="#DF6A14"/>
        </linearGradient>
      </defs>
      <g fill="url(#fg)">
        <path d="M76 145 C95 175 106 200 106 230 C106 255 93 270 76 280 C59 270 46 255 46 230 C46 200 57 175 76 145 Z"/>
        <path d="M274 145 C293 175 304 200 304 230 C304 255 291 270 274 280 C257 270 244 255 244 230 C244 200 255 175 274 145 Z"/>
        <path d="M175 0 C210 40 228 95 228 150 C228 205 205 250 175 275 C145 250 122 205 122 150 C122 95 140 40 175 0 Z"/>
      </g>
      <path d="M8 316 Q175 342 342 316" fill="none" stroke="#7a4e24" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="word">Ohnyk</div>
    <div class="slogan"><span class="dash"></span>Домашнє тепло у кожній страві<span class="dash r"></span></div>
  </div>
</body>
</html>
