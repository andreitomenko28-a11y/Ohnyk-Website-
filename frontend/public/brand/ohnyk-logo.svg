<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" role="img" aria-label="Ohnyk — домашнє тепло у кожній страві">
  <defs>
    <style>
      @font-face{font-family:'Poiret One';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
      .hnyk{font-family:'Poiret One',sans-serif;fill:#f5ead6;font-size:285px;letter-spacing:1.4px;}
      .slg{font-family:'Poiret One',sans-serif;fill:#e0a03c;font-size:34px;letter-spacing:9.6px;}
    </style>
    <radialGradient id="bg" cx="52%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3a2410"/><stop offset="38%" stop-color="#241408"/>
      <stop offset="72%" stop-color="#180d07"/><stop offset="100%" stop-color="#130a06"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F49630" stop-opacity="0.30"/><stop offset="42%" stop-color="#F49630" stop-opacity="0.10"/><stop offset="66%" stop-color="#F49630" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FAC24E"/><stop offset="45%" stop-color="#F0902A"/><stop offset="100%" stop-color="#DF6A14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5A11F"/><stop offset="50%" stop-color="#F6A82E"/><stop offset="100%" stop-color="#F6A82E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1254" height="1254" fill="url(#bg)"/>
  <ellipse cx="652" cy="477" rx="326" ry="288" fill="url(#glow)"/>

  <!-- Полум'я + дуга -->
  <g transform="translate(407.5 288) scale(1.2543)">
    <g fill="url(#fg)">
      <path d="M76 145 C95 175 106 200 106 230 C106 255 93 270 76 280 C59 270 46 255 46 230 C46 200 57 175 76 145 Z"/>
      <path d="M274 145 C293 175 304 200 304 230 C304 255 291 270 274 280 C257 270 244 255 244 230 C244 200 255 175 274 145 Z"/>
      <path d="M175 0 C210 40 228 95 228 150 C228 205 205 250 175 275 C145 250 122 205 122 150 C122 95 140 40 175 0 Z"/>
    </g>
    <path d="M8 316 Q175 342 342 316" fill="none" stroke="#7a4e24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Напис: відкрита O + hnyk (Poiret One) + акцент на y -->
  <g transform="translate(231.5 719.5) scale(2.43)">
    <path d="M37.02 89.94 A42 42 0 1 1 62.98 89.94" fill="none" stroke="#f5ead6" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text class="hnyk" x="470" y="944">hnyk</text>
  <rect x="888" y="756" width="19" height="70" rx="9" fill="url(#acc)" transform="rotate(11 897 791)"/>

  <!-- Слоган -->
  <line x1="150" y1="1000" x2="203" y2="1000" stroke="#c9862f" stroke-width="2"/>
  <line x1="1051" y1="1000" x2="1104" y2="1000" stroke="#c9862f" stroke-width="2"/>
  <text class="slg" x="627" y="1010" text-anchor="middle">ДОМАШНЄ ТЕПЛО У КОЖНІЙ СТРАВІ</text>
