<!DOCTYPE html>
<html>
<head>
  <title>Test Login</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    textarea { width: 100%; height: 300px; background: #222; color: #0f0; padding: 10px; }
    button { padding: 10px 20px; background: #ff6600; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🔐 Test Login</h1>
  <p>Це сторінка для тестування логіну. Результат у text area нижче.</p>
  <button onclick="testLogin()">Спробувати Login</button>
  <hr>
  <textarea id="log"></textarea>

  <script>
    const log = document.getElementById('log');

    function logMsg(msg) {
      log.value += msg + '\n';
      log.scrollTop = log.scrollHeight;
      console.log(msg);
    }

    async function testLogin() {
      log.value = '';
      logMsg('🚀 Починаємо тест...\n');

      try {
        logMsg('📡 POST на http://localhost:5173/api/auth/login');

        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            identifier: 'oksana@example.com',
            password: 'password123'
          })
        });

        logMsg('📊 Status: ' + response.status);
        logMsg('Headers: ' + JSON.stringify([...response.headers.entries()].slice(0, 5)));

        const data = await response.json();

        if (response.ok) {
          logMsg('\n✅ LOGIN SUCCESS!');
          logMsg('User: ' + data.user.fullName);
          logMsg('Token: ' + data.accessToken.substring(0, 30) + '...');
        } else {
          logMsg('\n❌ LOGIN FAILED');
          logMsg('Error: ' + data.error);
          logMsg('Details: ' + JSON.stringify(data.details));
        }
      } catch (err) {
        logMsg('\n💥 Exception: ' + err.message);
        logMsg('Stack: ' + err.stack);
      }
    }
  </script>
</body>
</html>
